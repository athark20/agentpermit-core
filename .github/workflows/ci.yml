name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway build + tests (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/AgentPermit.Gateway.Tests

      - name: Build (warnings are not errors; see csproj)
        run: dotnet build tests/AgentPermit.Gateway.Tests --no-restore -c Release

      - name: Test
        run: >
          dotnet test tests/AgentPermit.Gateway.Tests --no-build -c Release
          --logger "trx;LogFileName=gateway.trx"
          --results-directory TestResults

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Gateway tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-results
          path: TestResults

  console:
    name: Admin console build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json
      - run: npm ci
      - run: npm run build
