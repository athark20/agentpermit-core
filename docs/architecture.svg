<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="AgentPermit architecture">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arwG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
    <marker id="arwA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/>
    </marker>
    <marker id="arwR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
    <style>
      .lbl{fill:#0f172a;font-size:13px;font-weight:600}
      .sub{fill:#64748b;font-size:11px}
      .white{fill:#ffffff;font-size:13px;font-weight:700}
      .wsub{fill:#c7d2e0;font-size:10.5px}
      .tag{font-size:11px;font-weight:700}
      .edge{stroke:#334155;stroke-width:1.6;fill:none}
    </style>
  </defs>

  <rect x="0" y="0" width="1060" height="500" fill="#f5f7fa"/>
  <text x="34" y="40" fill="#0b2942" font-size="20" font-weight="800">AgentPermit — enforcement &amp; evidence gateway</text>
  <text x="34" y="62" class="sub" font-size="12.5">The agent calls AgentPermit before it acts. Only ALLOW proceeds; APPROVAL waits for a human; DENY stops. Every decision is a signed receipt.</text>

  <!-- Agent -->
  <rect x="34" y="150" width="150" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="109" y="188" text-anchor="middle" class="lbl">AI agent</text>
  <text x="109" y="206" text-anchor="middle" class="sub">Copilot Studio</text>
  <text x="109" y="221" text-anchor="middle" class="sub">/ any runtime</text>

  <!-- APIM -->
  <rect x="214" y="150" width="150" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="289" y="184" text-anchor="middle" class="lbl">APIM front door</text>
  <text x="289" y="203" text-anchor="middle" class="sub">validate JWT</text>
  <text x="289" y="218" text-anchor="middle" class="sub">inject identity</text>

  <!-- Gateway container -->
  <rect x="404" y="96" width="250" height="270" rx="16" fill="#0b2942"/>
  <text x="529" y="126" text-anchor="middle" class="white" font-size="14">AgentPermit Gateway</text>
  <rect x="426" y="142" width="206" height="40" rx="9" fill="#12324c"/>
  <text x="529" y="160" text-anchor="middle" class="white" font-size="12">Identity</text>
  <text x="529" y="174" text-anchor="middle" class="wsub">derived, not declared</text>
  <rect x="426" y="190" width="206" height="40" rx="9" fill="#12324c"/>
  <text x="529" y="208" text-anchor="middle" class="white" font-size="12">Action catalog + risk tiers</text>
  <text x="529" y="222" text-anchor="middle" class="wsub">what's governable, at what risk</text>
  <rect x="426" y="238" width="206" height="40" rx="9" fill="#12324c"/>
  <text x="529" y="256" text-anchor="middle" class="white" font-size="12">Rules — policy engine</text>
  <text x="529" y="270" text-anchor="middle" class="wsub">allow / ask / stop</text>
  <!-- Decision hub -->
  <rect x="452" y="296" width="154" height="48" rx="10" fill="#22b8cf"/>
  <text x="529" y="325" text-anchor="middle" fill="#04222b" font-size="14" font-weight="800">Decision</text>

  <!-- Outcomes -->
  <rect x="720" y="120" width="200" height="56" rx="12" fill="#e9f9ef" stroke="#16a34a"/>
  <text x="740" y="145" class="tag" fill="#15803d">ALLOW</text>
  <text x="740" y="163" class="sub" fill="#166534">execute via adapter → target</text>

  <rect x="720" y="208" width="200" height="56" rx="12" fill="#fff7e6" stroke="#d97706"/>
  <text x="740" y="233" class="tag" fill="#b45309">REQUIRE_APPROVAL</text>
  <text x="740" y="251" class="sub" fill="#92400e">human sign-off (Teams / console)</text>

  <rect x="720" y="296" width="200" height="56" rx="12" fill="#fdecec" stroke="#dc2626"/>
  <text x="740" y="321" class="tag" fill="#b91c1c">DENY</text>
  <text x="740" y="339" class="sub" fill="#7f1d1d">stopped</text>

  <!-- Receipt -->
  <rect x="720" y="392" width="200" height="58" rx="12" fill="#0b2942"/>
  <text x="820" y="416" text-anchor="middle" class="white" font-size="12">Signed, hash-chained</text>
  <text x="820" y="433" text-anchor="middle" class="white" font-size="12">receipt · evidence</text>

  <!-- DLP -->
  <rect x="214" y="286" width="150" height="58" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="289" y="310" text-anchor="middle" class="lbl" font-size="12">Zero-bypass DLP</text>
  <text x="289" y="327" text-anchor="middle" class="sub">agents can't skip the gate</text>

  <!-- Edges -->
  <line class="edge" x1="184" y1="195" x2="210" y2="195" marker-end="url(#arw)"/>
  <line class="edge" x1="364" y1="195" x2="400" y2="220" marker-end="url(#arw)"/>
  <path class="edge" d="M606,312 H660 V148 H716" marker-end="url(#arwG)" stroke="#16a34a"/>
  <path class="edge" d="M606,320 H690 V236 H716" marker-end="url(#arwA)" stroke="#d97706"/>
  <path class="edge" d="M606,328 H676 V324 H716" marker-end="url(#arwR)" stroke="#dc2626"/>
  <path class="edge" d="M920,148 H978 V421 H922" fill="none" stroke="#16a34a" stroke-dasharray="4 4" marker-end="url(#arwG)"/>
  <text x="986" y="290" class="sub" fill="#166534" font-size="10" transform="rotate(90 986 290)">receipt on ALLOW</text>
  <path d="M289,286 V250" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="300" y="272" class="sub" font-size="10">enforces</text>

  <text x="196" y="182" class="sub" font-size="10" text-anchor="middle">request an</text>
  <text x="196" y="194" class="sub" font-size="10" text-anchor="middle">action</text>
</svg>
